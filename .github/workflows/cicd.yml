# ============================================================
# AIOps Sentinel — CI/CD Pipeline
# Runs on every push to main and on pull requests
# Jobs: Lint → Test → Deploy Infrastructure → Deploy Lambda
# ============================================================

name: AIOps Sentinel CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:        ap-south-1
  FUNCTION_NAME:     aiops-incident-processor-dev
  TF_WORKING_DIR:    terraform/environments/dev
  PYTHON_VERSION:    "3.12"

jobs:

  # ── Job 1: Lint ─────────────────────────────────────────────
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install flake8 flake8-bugbear

      - name: Lint Lambda source
        run: |
          flake8 lambda/ ai/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E221,E302,E402 \
            --exclude=__pycache__

      - name: Lint test files
        run: |
          flake8 tests/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E221,E302,E402

  # ── Job 2: Test ─────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install boto3 pytest

      - name: Run event parser tests
        run: python tests/test_local_lambda.py
        env:
          AWS_REGION:        ap-south-1
          ENVIRONMENT:       dev
          DYNAMODB_TABLE_NAME: aiops-incidents-dev
          SNS_TOPIC_ARN:     arn:aws:sns:ap-south-1:000000000000:aiops-alerts
          SLACK_SECRET_NAME: aiops/slack/webhook

      - name: Run log processor tests
        run: python tests/test_log_processor.py
        env:
          AWS_REGION:  ap-south-1
          ENVIRONMENT: dev

      - name: Run notification formatter tests
        run: python tests/test_notifications.py
        env:
          AWS_REGION:  ap-south-1
          ENVIRONMENT: dev

  # ── Job 3: Deploy Infrastructure ────────────────────────────
  deploy-infra:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -var-file=terraform.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

  # ── Job 4: Deploy Lambda ────────────────────────────────────
  deploy-lambda:
    name: Deploy Lambda Function
    runs-on: ubuntu-latest
    needs: deploy-infra
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip dependencies
        run: pip install boto3

      - name: Package and deploy Lambda
        run: python scripts/deploy_lambda.py

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "{State:State,LastUpdateStatus:LastUpdateStatus,CodeSize:CodeSize}" \
            --output table

      - name: Smoke test — invoke Lambda
        run: |
          aws lambda invoke \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --payload file://tests/fixtures/lambda_test_event.json \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json
          # Fail if Lambda returned a FunctionError
          if grep -q "FunctionError" response.json; then
            echo "Lambda smoke test FAILED"
            exit 1
          fi
          echo "Smoke test PASSED"
